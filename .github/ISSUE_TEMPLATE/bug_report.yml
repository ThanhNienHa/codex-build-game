name: Bug report
description: Report incorrect, unsafe, or ineffective skill behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: task
    attributes:
      label: Game-development task
      description: What did you ask Codex to do?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Engine and version
  - type: textarea
    id: evidence
    attributes:
      label: Minimal reproduction or evidence
      description: Remove secrets and proprietary assets.
