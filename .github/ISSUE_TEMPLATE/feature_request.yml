name: Workflow proposal
description: Propose a reusable game-development workflow improvement.
title: "[Proposal]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Repeated problem
      description: Describe the concrete failure or missing capability.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed workflow
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Example task and acceptance criteria
    validations:
      required: true
