name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_repo.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_evals.py
      - run: python scripts/run_fixture_checks.py
      - run: python skills/build-game/scripts/validate_evidence.py skills/build-game/assets/evidence-manifest.example.json
